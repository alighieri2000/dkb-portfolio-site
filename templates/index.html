<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1113" media="(prefers-color-scheme: dark)">
<title>{{page_title}}{{site_name}}</title>
<meta name="description" content="{{site_description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="{{root}}assets/site.css">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
</head>
<body class="home">
<header class="top">
  <a class="brand" href="{{root}}">{{site_name}}</a>
  <nav>{{nav}}</nav>
</header>
<section class="intro-home">
  <h1>{{headline}}</h1>
  <p>{{intro}}</p>
  <div class="where">{{where}}</div>
</section>
<main class="covers">
{{covers}}
</main>
<footer class="foot" id="contact">
  <span>{{site_name}}</span>
  <span class="email" data-email="{{email}}">{{email}}</span>
</footer>
<script src="{{root}}assets/site.js"></script>
</body>
</html>

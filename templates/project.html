<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}} · {{site_name}}</title>
<meta name="description" content="{{subtitle}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="{{root}}assets/site.css">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
</head>
<body class="project">
<header class="top">
  <a class="brand" href="{{root}}">{{site_name}}</a>
  <nav><a href="{{root}}">All work</a>{{nav}}</nav>
</header>
<main>
  <section class="hero">{{hero}}</section>
  <section class="intro">
    {{draft_note}}
    <h1>{{title}}</h1>
    <p class="sub">{{subtitle}}</p>
    <dl class="spec">{{spec}}</dl>
  </section>
  <article class="body">
{{body}}
  </article>
  <nav class="pn">{{prevnext}}</nav>
</main>
<footer class="foot" id="contact">
  <span>{{site_name}}</span>
  <span class="email" data-email="{{email}}">{{email}}</span>
</footer>
<script src="{{root}}assets/site.js"></script>
</body>
</html>
